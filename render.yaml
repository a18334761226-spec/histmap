# Render 蓝图：连上仓库后可以直接一键部署
# 文档见 DEPLOY.md
services:
  - type: web
    name: histmap
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # **不要在这里写死 PORT**。Render 自己会注入 PORT，并且按它去探活；
      # 我们如果也写一个（早先写的是 8810），就会把 Render 注入的值盖掉，
      # 于是应用监听的端口和 Render 探活的端口不一致 —— 表现为部署完成但
      # 一直 unhealthy，日志里什么错都看不到。
      # app.py 见到 $PORT 就绑 0.0.0.0:$PORT，不写死才是对的。
      - key: HOST
        value: 0.0.0.0
