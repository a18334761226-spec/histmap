<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>histmap · 历史地图生成器</title>
<style>
  :root{
    --bg:#0f0d0a; --panel:#17151210; --paper:#efe7d6; --paper2:#e6dcc7;
    --ink:#2b2620; --ink2:#6b6154; --line:#c9bda6; --line2:#8d8튼;
    --accent:#8c3a2e; --accent2:#3f6b8a; --ok:#3d7a4e; --err:#a33;
    --mono:"SFMono-Regular",Consolas,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);
    color:var(--ink);font:15px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}

  /* ── 顶栏 ── */
  header{height:52px;display:flex;align-items:center;gap:14px;padding:0 18px;
    border-bottom:1px solid var(--line);background:linear-gradient(#f7f1e4,#efe7d6)}
  header .logo{font-weight:800;letter-spacing:.02em;font-size:16px}
  header .logo span{color:var(--accent)}
  header .sub{font-size:12px;color:var(--ink2)}
  header .right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .btn{border:1px solid var(--line);background:rgba(255,255,255,.5);
    border-radius:4px;padding:6px 12px;font-size:13px;transition:.12s}
  .btn:hover{border-color:var(--accent);background:#fff}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#7a3227}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .dot{width:7px;height:7px;border-radius:50%;background:#bbb;display:inline-block}
  .dot.on{background:var(--ok)}

  /* ── 主体两栏 ── */
  main{height:calc(100% - 52px);display:grid;grid-template-columns:340px minmax(0,1fr);
    min-height:0;overflow:hidden}
  .side{border-right:1px solid var(--line);display:flex;flex-direction:column;
    min-height:0;min-width:0;overflow:hidden;background:#f2ebdd}
  .side h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink2);margin:0;padding:11px 16px 7px;font-weight:700;flex:none}
  /* 对话占固定比例且内部滚动；下半部分自己滚。两者都不许把父容器撑破 */
  .chat{display:flex;flex-direction:column;min-height:0;flex:0 0 42%;
    border-bottom:1px solid var(--line)}
  #msgs{flex:1;overflow-y:auto;padding:4px 14px 10px;min-height:0}
  .sideScroll{flex:1;min-height:0;overflow-y:auto;padding-bottom:12px}
  .m{margin-bottom:10px;font-size:13.5px;line-height:1.62}
  .m.u{text-align:right}
  .m .b{display:inline-block;padding:7px 11px;border-radius:9px;max-width:92%;
    text-align:left;white-space:pre-wrap;word-break:break-word}
  .m.u .b{background:var(--accent);color:#fff;border-bottom-right-radius:2px}
  .m.a .b{background:rgba(255,255,255,.72);border:1px solid var(--line);
    border-bottom-left-radius:2px}
  .m .hint{font-size:11.5px;color:var(--ink2);margin-top:4px}
  .composer{padding:8px 12px 12px;display:flex;gap:8px;align-items:flex-end}
  .composer textarea{flex:1;resize:none;height:60px;padding:8px 10px;
    border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13.5px}
  .composer textarea:focus{outline:none;border-color:var(--accent)}

  /* 参数 */
  .params{padding:0 16px 14px;display:grid;gap:9px}
  .f{display:grid;grid-template-columns:52px 1fr;gap:9px;align-items:center;
    font-size:13px}
  .f label{color:var(--ink2)}
  .f select,.f input[type=text]{width:100%;padding:5px 8px;border:1px solid var(--line);
    border-radius:4px;background:#fff;font-size:13px}
  .f input[type=range]{width:100%;accent-color:var(--accent)}
  .daterow{display:flex;align-items:center;gap:8px}
  .daterow .d{font-family:var(--mono);font-size:13px;min-width:96px;font-weight:700}

  /* 风格参考 */
  .styl{flex:1;min-height:0;display:flex;flex-direction:column}
  #drop{margin:0 16px;border:1.5px dashed var(--line);border-radius:8px;
    padding:14px;text-align:center;color:var(--ink2);font-size:13px;
    cursor:pointer;transition:.15s;background:rgba(255,255,255,.35)}
  #drop:hover,#drop.over{border-color:var(--accent);background:#fff}
  #drop img{max-width:100%;max-height:76px;border-radius:4px;display:block;margin:0 auto 6px}
  .pal{display:flex;gap:4px;margin-top:8px;justify-content:center;flex-wrap:wrap}
  .pal i{width:18px;height:18px;border-radius:3px;border:1px solid rgba(0,0,0,.15)}
  .advice{font-size:11.5px;color:var(--ink2);margin:8px 16px 0;line-height:1.5}
  .srcline{font-size:11px;color:var(--ink2);line-height:1.55;
    background:rgba(140,58,46,.06);border-left:2px solid var(--accent);
    padding:7px 9px;border-radius:0 3px 3px 0;display:none}

  /* ── 结果区 ── */
  .stage{display:flex;flex-direction:column;min-height:0;background:
    radial-gradient(120% 80% at 50% 0%, #f7f1e4 0%, #e8dfcc 70%)}
  .toolbar{display:flex;align-items:center;gap:10px;padding:12px 18px;
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  .toolbar .meta{font-size:12px;color:var(--ink2);margin-left:auto;
    font-family:var(--mono)}
  .view{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
    padding:18px;position:relative}
  .view img,.view video{max-width:100%;max-height:100%;border-radius:3px;
    box-shadow:0 12px 40px rgba(0,0,0,.28);background:#000}
  .empty{text-align:center;color:var(--ink2);font-size:14px;line-height:1.9}
  .empty b{color:var(--ink);font-size:16px;display:block;margin-bottom:6px}
  .spinner{width:26px;height:26px;border:3px solid var(--line);
    border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;
    margin:0 auto 12px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;
    margin:12px auto 0;max-width:340px}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:.3s}

  /* ── 设置弹层 ── */
  .mask{position:fixed;inset:0;background:rgba(20,16,12,.5);display:none;
    align-items:center;justify-content:center;z-index:50}
  .mask.on{display:flex}
  .modal{background:var(--paper);border-radius:8px;width:min(560px,92vw);
    padding:26px 28px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
  .modal h2{margin:0 0 6px;font-size:19px}
  .modal p.h{margin:0 0 20px;font-size:13px;color:var(--ink2)}
  .modal .f{grid-template-columns:108px 1fr;margin-bottom:12px}
  .modal .f label{font-size:13px}
  .modal .f input,.modal .f select{width:100%;padding:7px 10px;border:1px solid var(--line);
    border-radius:5px;background:#fff;font-size:13.5px}
  .modal .note{font-size:12px;color:var(--ink2);background:rgba(140,58,46,.07);
    border-left:3px solid var(--accent);padding:10px 12px;border-radius:0 4px 4px 0;
    margin:14px 0 18px;line-height:1.6}
  .modal .acts{display:flex;gap:10px;justify-content:flex-end}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:#221f1a;color:#f0e9dc;padding:10px 18px;border-radius:6px;
    font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
  .toast.on{opacity:1}
  @media(max-width:900px){main{grid-template-columns:1fr}.side{display:none}}
</style>
</head>
<body>

<header>
  <div class="logo">hist<span>map</span></div>
  <div class="sub">输入一句话，出一张历史地图</div>
  <div class="right">
    <span id="keyState" class="sub"><span class="dot" id="dot"></span> <span id="keyText">未填 Key</span></span>
    <button class="btn" id="btnSettings">设置</button>
  </div>
</header>

<main>
  <div class="side">
    <!-- 对话 -->
    <div class="chat">
      <h3>对话</h3>
      <div id="msgs"></div>
      <div class="composer">
        <textarea id="chatIn" placeholder="例如：唐宪宗二年的军阀格局图，宣纸风格，方形&#10;或者：改成竖屏，加个视频"></textarea>
        <button class="btn primary" id="btnSend">发送</button>
      </div>
    </div>

    <!-- 参数 + 风格参考（放在可滚动区里，避免把侧栏撑破） -->
    <div class="sideScroll">
    <div>
      <h3>参数</h3>
      <div class="params">
        <div class="f"><label>场景</label><select id="pScene"></select></div>
        <div class="f"><label>日期</label>
          <div class="daterow">
            <input type="range" id="pDate" min="0" max="0" value="0">
            <span class="d" id="pDateLbl">—</span>
          </div>
        </div>
        <div class="f"><label>主题</label><select id="pTheme"></select></div>
        <div class="f"><label>质感</label><select id="pStyle"></select></div>
        <div class="f"><label>尺寸</label><select id="pSize">
          <option value="16x9">16:9 横屏</option>
          <option value="9x16">9:16 竖屏</option>
          <option value="4x3">4:3 方形</option>
        </select></div>
        <div id="srcNote" class="srcline"></div>
      </div>
    </div>

    <!-- 风格参考图 -->
    <div class="styl">
      <h3>风格参考图</h3>
      <div id="drop">
        <div id="dropInner">拖一张图进来，或点这里选择<br>
          <span style="font-size:11.5px">它只量色调/纹理/颗粒，不调模型</span></div>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
      <div class="pal" id="pal"></div>
      <div class="advice" id="advice"></div>
    </div>
    </div><!-- /sideScroll -->
  </div>

  <!-- 结果 -->
  <div class="stage">
    <div class="toolbar">
      <button class="btn primary" id="btnRender">生成图片</button>
      <button class="btn" id="btnVideo">用这张图出视频</button>
      <button class="btn" id="btnRetry" style="display:none">重试</button>
      <span class="meta" id="meta"></span>
    </div>
    <div class="view" id="view">
      <div class="empty">
        <b>还没有结果</b>
        左边说一句话，或直接点「生成图片」。<br>
        <span style="font-size:13px">比如：「唐宪宗二年的军阀格局图」</span>
      </div>
    </div>
  </div>
</main>

<!-- 设置 -->
<div class="mask" id="mask">
  <div class="modal">
    <h2>设置</h2>
    <p class="h">Key 只存在这台机器的浏览器里，不会上传、不会写盘。</p>

    <div class="f"><label>API 服务</label>
      <select id="sPreset">
        <option value="https://api.siliconflow.cn/v1">硅基流动（国内直连，推荐）</option>
        <option value="https://api-inference.modelscope.cn/v1">魔搭 ModelScope</option>
        <option value="__custom__">自定义…</option>
      </select>
    </div>
    <div class="f"><label>Base URL</label><input type="text" id="sBase"></div>
    <div class="f"><label>API Key</label><input type="password" id="sKey" placeholder="sk-… 或 ms-…"></div>
    <div class="f"><label>对话模型</label><select id="sChat"></select></div>
    <div class="f"><label>出图模型</label><select id="sImage"></select></div>

    <div class="note">
      <b>对话功能</b>需要一个能跑 LLM 的 key（上面的「对话模型」）。<br>
      <b>出图和出片不需要 key</b> —— 渲染全部在本地用代码完成，零成本。<br>
      「出图模型」只在你要用 AI 风格化时才用得上，而实测它会破坏地图数据，默认不用。
    </div>

    <div class="acts">
      <button class="btn" id="sClear">清空</button>
      <button class="btn primary" id="sSave">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const api = (p, opt={}) => {
  const h = Object.assign({'Content-Type':'application/json'}, opt.headers||{});
  const cfg = JSON.parse(localStorage.getItem('histmap.cfg') || '{}');
  if (cfg.key) h['X-Api-Key'] = cfg.key;
  if (cfg.chat) h['X-Model'] = cfg.chat;
  if (cfg.base) h['X-Base-Url'] = cfg.base;
  return fetch(p, Object.assign({}, opt, {headers: h}));
};
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2600);
}
const busy = (b) => { $('#btnRender').disabled = b; $('#btnSend').disabled = b; };

// ── 状态 ──
let SCENES = [], STYLES = [], state = {}, styleProfile = null, lastImage = null;

// ── 对话渲染 ──
function addMsg(role, text, hint){
  const d = document.createElement('div');
  d.className = 'm ' + (role === 'user' ? 'u' : 'a');
  d.innerHTML = `<div class="b">${esc(text)}</div>` + (hint?`<div class="hint">${esc(hint)}</div>`:'');
  $('#msgs').appendChild(d); $('#msgs').scrollTop = 1e9;
  return d;
}
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// ── 设置 ──
function loadCfg(){
  const c = JSON.parse(localStorage.getItem('histmap.cfg') || '{}');
  const on = !!c.key;
  $('#dot').className = 'dot' + (on ? ' on' : '');
  $('#keyText').textContent = on ? (c.chat || '已填 Key').split('/').pop() : '未填 Key';
  return c;
}
async function openSettings(){
  const c = loadCfg();
  const m = await (await fetch('/api/models')).json();
  const fill = (sel, arr, val) => {
    sel.innerHTML = arr.map(x => `<option value="${x.id}">${x.label}</option>`).join('');
    if (val) sel.value = val;
  };
  fill($('#sChat'), m.chat, c.chat);
  fill($('#sImage'), m.image_edit, c.image);
  $('#sKey').value = c.key || '';
  $('#sBase').value = c.base || 'https://api.siliconflow.cn/v1';
  const known = ['https://api.siliconflow.cn/v1','https://api-inference.modelscope.cn/v1'];
  $('#sPreset').value = known.includes($('#sBase').value) ? $('#sBase').value : '__custom__';
  $('#mask').classList.add('on');
}
$('#btnSettings').onclick = openSettings;
$('#sPreset').onchange = e => { if (e.target.value !== '__custom__') $('#sBase').value = e.target.value; };
$('#sSave').onclick = () => {
  localStorage.setItem('histmap.cfg', JSON.stringify({
    base: $('#sBase').value.trim(), key: $('#sKey').value.trim(),
    chat: $('#sChat').value, image: $('#sImage').value }));
  $('#mask').classList.remove('on'); loadCfg(); toast('已保存到本机浏览器');
};
$('#sClear').onclick = () => {
  localStorage.removeItem('histmap.cfg'); $('#sKey').value = '';
  loadCfg(); toast('已清空');
};
$('#mask').onclick = e => { if (e.target.id === 'mask') $('#mask').classList.remove('on'); };

// ── 参数同步 ──
function syncUI(){
  $('#pScene').value = state.scene;
  const sc = SCENES.find(s => s.id === state.scene);
  const ds = sc ? sc.dates : [];
  const i = Math.max(0, ds.indexOf(state.date));
  const r = $('#pDate');
  r.max = Math.max(0, ds.length - 1); r.value = i;
  $('#pDateLbl').textContent = state.date || '—';
  $('#pTheme').innerHTML = (sc?sc.themes:['dark'])
    .map(t => `<option value="${t}">${t==='dark'?'深色（短视频）':'浅色（古籍）'}</option>`).join('');
  $('#pTheme').value = state.theme;
  $('#pStyle').value = state.style || 'none';
  $('#pSize').value = state.size || (sc?sc.default_size:'16x9');
  // 出处与口径：题材是数据，来源说明也写在数据里
  const note = sc ? (sc.source_note || '') : '';
  $('#srcNote').textContent = note;
  $('#srcNote').style.display = note ? 'block' : 'none';
}
function pullUI(){
  const sc = SCENES.find(s => s.id === $('#pScene').value);
  const ds = sc ? sc.dates : [];
  state = {
    scene: $('#pScene').value,
    date: ds[Number($('#pDate').value)] || state.date,
    theme: $('#pTheme').value,
    style: $('#pStyle').value,
    size: $('#pSize').value,
  };
  $('#pDateLbl').textContent = state.date || '—';
  $('#advice').textContent = $('#advice').dataset.base || '';
}

// ── 渲染 ──
function showLoading(text, prog){
  $('#view').innerHTML = `<div class="empty"><div class="spinner"></div>${esc(text)}
    ${prog!=null?`<div class="bar"><i style="width:${Math.round(prog*100)}%"></i></div>`:''}</div>`;
}
async function doRender(){
  pullUI(); busy(true); showLoading('渲染中…');
  const t0 = performance.now();
  try{
    const body = Object.assign({}, state);
    if (styleProfile && $('#useStyle')?.checked !== false) body.style_profile = styleProfile;
    const r = await api('/api/render', {method:'POST', body: JSON.stringify(body)});
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || '渲染失败');
    lastImage = j;
    $('#view').innerHTML =
      `<img src="${j.image}?t=${Date.now()}" alt="结果"
            onerror="this.style.display='none';document.getElementById('imgErr').style.display='block'">
       <div id="imgErr" style="display:none;color:#a33;font-size:14px;text-align:center">
         图片加载失败：${esc(j.image)}<br>
         <span style="font-size:12px;color:var(--ink2)">服务端产出了文件但取不到 —— 检查服务是否还在跑</span>
       </div>`;
    $('#meta').textContent = `${j.width}×${j.height} · 渲染 ${j.elapsed}s`;
    $('#btnVideo').disabled = false;
    addMsg('assistant', `好了（${j.elapsed}s）。`, `${state.scene} · ${state.date} · ${state.theme} · ${state.style}`);
  }catch(e){ toast(e.message); showLoading('出错了：' + e.message); }
  finally{ busy(false); }
}

// ── 视频 ──
async function doVideo(){
  pullUI();
  const sc = SCENES.find(s => s.id === state.scene);
  const ds = sc ? sc.dates : [];
  const i = ds.indexOf(state.date);
  const from = ds[Math.max(0, i - 8)] || ds[0], to = ds[Math.min(ds.length-1, i + 8)] || ds[ds.length-1];
  busy(true); showLoading('提交视频任务…');
  try{
    const r = await api('/api/video', {method:'POST', body: JSON.stringify({
      scene: state.scene, date_from: from, date_to: to,
      theme: state.theme, size: state.size === '4x3' ? '16x9' : state.size,
      style: state.style, fps: 24, hold: 0.3, max_frames: 40})});
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || '提交失败');
    const jid = j.job;
    addMsg('assistant', `视频任务已提交（${from} → ${to}），渲染需要一会儿。`, `任务 ${jid}`);
    while(true){
      await new Promise(s => setTimeout(s, 1200));
      const st = await (await fetch('/api/jobs/' + jid)).json();
      if (st.status === 'failed') throw new Error(st.error || '渲染失败');
      showLoading(st.message || '处理中…', st.progress);
      if (st.status === 'done'){
        const v = st.result;
        $('#view').innerHTML = `<video src="${v.video}?t=${Date.now()}" controls autoplay loop></video>`;
        $('#meta').textContent = `${v.frames} 帧 · ${v.seconds}s · ${v.n_keyframes} 个关键帧`;
        addMsg('assistant', `视频好了：${v.seconds} 秒 / ${v.n_keyframes} 个关键帧。`);
        break;
      }
    }
  }catch(e){ toast(e.message); showLoading('出错了：' + e.message); }
  finally{ busy(false); }
}

// ── 对话 ──
let history = [];
async function doChat(){
  const txt = $('#chatIn').value.trim();
  if (!txt) return;
  pullUI();
  addMsg('user', txt); $('#chatIn').value = '';
  history.push({role:'user', content: txt});
  const wait = addMsg('assistant', '…');
  busy(true);
  try{
    const r = await api('/api/chat', {method:'POST', body: JSON.stringify({
      messages: history, state})});
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || '对话失败');
    wait.remove();
    addMsg('assistant', j.reply || '(无回复)');
    history.push({role:'assistant', content: j.reply || ''});
    if (j.state) { state = Object.assign(state, j.state); syncUI(); }
    if (j.action === 'video') await doVideo();
    else if (j.action === 'render') await doRender();
  }catch(e){
    wait.remove(); toast(e.message);
    addMsg('assistant', '这边出了点问题：' + e.message,
           e.message.includes('Key') ? '点右上角「设置」填一个' : '');
  }finally{ busy(false); }
}

// ── 风格参考图 ──
const drop = $('#drop');
drop.onclick = () => $('#file').click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files[0]) uploadStyle(e.dataTransfer.files[0]); };
$('#file').onchange = e => { if (e.target.files[0]) uploadStyle(e.target.files[0]); };

async function uploadStyle(f){
  const fd = new FormData(); fd.append('file', f);
  drop.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px"></div>提取中…';
  try{
    const r = await api('/api/style/extract', {method:'POST', body: fd, headers:{}});
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || '提取失败');
    styleProfile = j.profile;
    const pal = (j.profile.palette||[]).map(p =>
      `<i style="background:${p.hex}" title="${p.hex}"></i>`).join('');
    drop.innerHTML = `<img src="${j.preview}?t=${Date.now()}">
      <div style="font-size:12px">已提取风格 · 点击可换一张</div>`;
    $('#pal').innerHTML = pal;
    $('#advice').dataset.base = j.profile._advice || '';
    $('#advice').textContent = j.profile._advice || '';
    toast('风格已提取');
    await doRender();
  }catch(e){
    drop.innerHTML = '提取失败：' + esc(e.message) + '<br><span style="font-size:11.5px">点这里重试</span>';
    toast(e.message);
  }
}

// ── 启动 ──
(async function boot(){
  loadCfg();
  const s = await (await fetch('/api/scenes')).json();
  SCENES = s.scenes;
  const st = await (await fetch('/api/styles')).json();
  STYLES = st.presets;
  $('#pStyle').innerHTML = STYLES.map(x => `<option value="${x.id}">${x.label}</option>`).join('');
  $('#pScene').innerHTML = SCENES.map(x => `<option value="${x.id}">${x.title}</option>`).join('');
  const first = SCENES.find(x => x.id === 'tang') || SCENES[0];
  state = {scene: first.id, date: first.default_date, theme: first.themes[0],
           style: 'none', size: first.default_size || '16x9'};
  syncUI();

  addMsg('assistant', '说一句你想要的历史地图。比如：\n' +
    '· 唐宪宗二年的军阀格局图，宣纸风格\n· 1941 年欧洲谁控制谁，横屏\n· 改成竖屏再加个视频',
    '出图不需要 Key；对话改参数需要一个 LLM Key');
})();

$('#btnRender').onclick = doRender;
$('#btnVideo').onclick = doVideo;
$('#btnSend').onclick = doChat;
$('#chatIn').onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) doChat(); };
$('#pScene').onchange = () => {
  const sc = SCENES.find(s => s.id === $('#pScene').value);
  state = {scene: sc.id, date: sc.default_date, theme: sc.themes[0],
           style: state.style || 'none',
           size: sc.default_size || '16x9'};
  syncUI();
};
$('#pDate').oninput = () => { const sc = SCENES.find(s=>s.id===state.scene);
  state.date = sc.dates[Number($('#pDate').value)]; $('#pDateLbl').textContent = state.date; };
$('#pTheme').onchange = () => { state.theme = $('#pTheme').value; };
$('#pStyle').onchange = () => { state.style = $('#pStyle').value; };
$('#pSize').onchange = () => { state.size = $('#pSize').value; };
</script>
</body>
